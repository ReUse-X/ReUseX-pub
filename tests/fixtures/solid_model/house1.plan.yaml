description: "DRAFT v3 (grid-snapped) - needs maintainer review. Agent-authored on the house1 scan (scan archive 2024-06-13_house-1_afb3234950) with the loop in docs/guides/solid-model-reference-authoring.md; not ground truth (decision D5). Re-fitted on the house1 pose reference (DRAFT v2, tests/fixtures/pose_reference/house1.*). One storey with a split level: north block floor at level z 0.75, south block and east wing at z 0; the south block and wing have a mono-pitch ceiling (one ceiling plane per space, sloped wall tops). Coordinates in the detected level frame stored in level_transform."
