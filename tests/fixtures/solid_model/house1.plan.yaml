#
# house1 reference plan -- DRAFT, maintainer review pending (reusex-yf4.3).
#
# Hand-authored ground-truth target for the solid-model benchmark
# (docs/design/solid-model-json.md, docs/guides/solid-model-reference-authoring.md).
# Never round-trip this file through a writer (rux edit plan --export drops the
# comments): edit it by hand with the --watch loop.
#
# Source scan: scan archive 2024-06-13_house-1_afb3234950/reusex/project.rux
# (238 frames). Since 2026-11-01 (reusex-rcv.1.8) the plan is RE-FITTED on the
# house1 pose reference (DRAFT v2 since 2026-11-03, tests/fixtures/pose_reference/
# house1.*): solve the copy with the replay command in house1.edits.yaml
# (`rux optimize --edits house1.edits.yaml --manhattan --manhattan-max-angle 10
# --manhattan-sigma 0.25 --manhattan-frame-sigma 1 --prior-sigma-rot 1`), then
# `rux create clouds`, `create planes`,
# `create storeys` (one storey; recipe in scripts/bench-solid.manifest). Nothing
# derived from the scan except this file is committed; point $REUSEX_HOUSE1_RUX
# at such a copy to use it.
#
# What the scan shows: an empty, stripped single-family house, one storey with a
# SPLIT LEVEL. The north block (entrance, WC, utility, kitchen, hall, two bedrooms)
# has its floor 0.75 m above the south block (living room, room S2, bathroom) and
# the east wing (bedroom, back entry); a short stair at x ~ -7.3 leads down from
# the hall into the living room, and the hall overlooks the living room over a
# parapet. The south block and the wing have a mono-pitch ceiling (~2.38 at the
# south facade to ~3.0 at the split wall). (reusex-2kd quoted ~0.85 m for the
# step; the floor-plane modes here give 0.75 m: north 0.73-0.75, south 0.00-0.02.)
#
# How the split level is represented: ONE storey (z_floor 0 = the lower, south
# floor). North-block spaces have z_floor 0.75 and its walls z_base 0.75; the two
# split walls (i-split-w/-e) run 0 -> 3.09. The stair itself is not represented
# (see the follow-up bead in the report / reusex-yf4.3 notes).
#
# Sloped ceiling (model_version 2, reusex-546, 2026-11-01): each south-block and
# wing space has one ceiling plane (z_ceiling 3.09 caps it) and the walls
# running north-south under it a `top` that follows it. Measured from the raw
# cloud, not from any detected plane: points 2.1-3.4 m above the floor inside
# each space's polygon, binned every 0.25 m along the normal of the south facade
# (x-south-1's direction), the 90th percentile per bin, a straight line through
# the bins; residuals <= 2 cm. Living room 2.344 + 0.191 v, room S2 2.372 +
# 0.178 v, bathroom 2.348 + 0.181 v, wing bedroom 2.337 + 0.147 v, back entry
# 2.372 + 0.128 v (v in m from the facade line through (-10.419, -1.643)): ~10
# deg in the south block, ~8 deg in the wing. Wall tops: the plane of the room
# beside, the mean of the two for a partition.
#
# Method: wall faces fitted per 0.4 m bin from the cloud (sensor-oriented normals
# tell which side a face was seen from), axis = mean of the two faces, thickness =
# their separation where both sides agree; -1 (unknown) for external walls (only
# the inner face scanned; axis on the inner face) and where pose drift makes the
# two faces disagree by > 10 cm. Openings from depth-coloured elevations of the
# wall band. Rooms named from the sensor images (frame ids in each space's
# metadata); the house is empty, so names rest on fixtures left behind.
# The plan was first drawn on the stored poses, where pose drift between rooms
# was 5-40 cm in places; the face notes on the walls (inverted faces, "drift")
# describe those poses. Re-fit on the pose reference (2026-11-01): the reference
# turns the trajectory ~4 deg (the Manhattan gauge) and moves room S2 and the
# bathroom 0.2 m against the north block, so the plan was moved PER ROOM, not
# rigidly: every wall axis and space vertex by the median displacement (stored
# -> reference poses) of the cloud points within 0.6 m of it seen from the
# camera block of its room(s) (north block 1-118, living room 119-140, S2
# 141-160, bathroom 161-187, wing bedroom 188-223, back entry 224-239), the
# ceiling planes with their room's block. Then every wall's faces were fitted on
# the reference cloud per side (wallfit), and the axes that sat > 2 cm off
# re-measured: x-south-1 and x-south-3 (inner face, up to 7 / 10 cm) and
# i-split-e, i-s1, i-n3 (face mean). On the reference the split wall's faces are
# in the right order (0.03-0.18 m apart along i-split-e, was inverted by up to
# 0.18 m) and i-s1's too; thicknesses stay unknown (-1) where the plan had them
# so. Guids and names unchanged; space polygons were moved, not re-measured
# (corners within a few cm of the wall axes).
# Re-fit on pose reference v2 (2026-11-03, PR #116 review): v2 puts the Manhattan
# grid on world x / y (v1 left it at +1.6 deg, so the house was drawn turned),
# straightens per-room headings and moves S2 + bathroom 0.09 m south only (v1:
# 0.2 m S + 0.2 m E). The same per-room procedure, v1 reference -> v2 reference
# (per-room rigid fits: yaw -1.3..-2.6 deg, shifts 3-16 cm), then wallfit on the
# v2 cloud and the axes > 2 cm off re-measured: x-south-1/-2/-3, x-east-n,
# x-north-e (inner face), i-split-e, i-s3, i-s4, i-n-w1, i-n3, i-n1 (face mean).
# Walls off the grid: median 1.41 -> 0.78 deg (length-weighted 1.49 -> 0.74).
# The south facade is now one line within 0.1 m (x-south-1/2/3 at +0.8 / -0.6
# / +0.9 deg; v1 had a 10 cm jog at the wing, which came from v1's 0.2 m move).
