    source: manual
    locked: true
    metadata: {status: "draft - needs maintainer review", split_level: "north block floor at z 0.75, south block at z 0 (one storey; the split level is carried by z_floor of the spaces and z_base of the walls)", sloped_ceiling: "south row: one ceiling plane, the main roof's south pitch, 2.345 at the facade -> 3.085 at the split wall (10.5 deg); annex (wing bedroom + back entry): one plane, mono pitch 2.341 -> 2.94 (8.4 deg), rising to the north; north block flat at 3.09", roof: "NOT EXPRESSIBLE in solid-model v2 (no roof element; reusex-v5jl). Per the maintainer review (PR #116): the main house has a pitched roof whose RIDGE runs over the split-level wall (i-split-w/-e, y 2.19), and the annex east of x 1.58 (wing bedroom, back entry) a mono-pitch roof. The scan shows the south pitch as the south row's ceiling (2.345 at the facade -> 3.085 at the split wall, 10.5 deg) and the annex pitch as its ceiling (8.4 deg, rising to the north, 2.94 at its north wall); the north block has a flat ceiling at 3.09 with an attic above. CONFLICT to check on site: through the attic hatch in the kitchen (x -5..-3, y 6.5..7.5) the roof structure rises TOWARD the north facade (z 4.83 at y 6.7 -> 5.15 at y 7.9) and the north wall continues up to z ~4.7, which a pitch falling north from a ridge at y 2.19 would not reach."}
